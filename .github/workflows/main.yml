name: Build and deploy - Catalogo de Jogos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: jogos-production
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Instalar dependencias e verificar sintaxe
        working-directory: app
        run: |
          npm install --omit=dev
          node --check index.js
      - name: Login Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publicar WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: web-jogos-563531-0928
          package: ./app
